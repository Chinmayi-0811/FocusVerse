<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Dashboard</title>

<link rel="stylesheet"
href="dashboard.css">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

<h2 class="logo">
FocusVerse
</h2>

<ul>

<li class="active">

<a href="dashboard.html">
Dashboard
</a>

</li>

<li>

<a href="analytics.html">
Analytics
</a>

</li>

<li>

<a href="music.html">
Music
</a>

</li>

<li>

<a href="settings.html">
Settings
</a>

</li>

</ul>

<button
class="logout-btn"
onclick="logout()">

Logout

</button>

</div>

<!-- Main Content -->

<div class="main-content">

<div class="topbar">

<h1 id="welcomeText">
Welcome 👋
</h1>

<p>
Stay productive today.
</p>

</div>

<br>

<div class="dashboard-grid">

<!-- Timer -->

<div class="card">

<h2>
Pomodoro Timer
</h2>

<div class="timer-circle">

<span id="timer">
25:00
</span>

</div>

<div class="button-group">

<button onclick="startTimer()">
Start
</button>

<button onclick="pauseTimer()">
Pause
</button>

<button onclick="resetTimer()">
Reset
</button>

</div>

</div>

<!-- Tasks -->

<div class="card">

<h2>
Task Board
</h2>

<div class="task-section">

<input
type="text"
id="taskInput"
placeholder="Enter Task">

<button onclick="addTask()">
Add
</button>

</div>

<ul id="taskList"></ul>

</div>

<!-- Productivity -->

<div class="card">

<h2>
Productivity
</h2>

<div class="progress-bar">

<div
class="progress"
id="progress">

</div>

</div>

<br>

<p id="sessionCount">
0 Sessions Completed
</p>

</div>

<!-- Music -->

<div class="card">

<h2>
Ambient Sounds
</h2>

<div class="music-buttons">

<button onclick="playRain()">
🌧 Rain
</button>

<button onclick="playForest()">
🌲 Forest
</button>

<button onclick="playLofi()">
🎵 Lo-Fi
</button>

<button onclick="stopAudio()">
⛔ Stop
</button>

</div>

<br>

<input
type="range"
id="volumeSlider"
min="0"
max="1"
step="0.1"
value="0.5">

</div>

<!-- Quote -->

<div class="card">

<h2>
Daily Motivation
</h2>

<p id="quote">

Success starts with consistency.

</p>

</div>

</div>

</div>

<!-- Audio -->

<audio
id="rainAudio"
src="nils_vega-rain-365610.mp3"
loop>
</audio>

<audio
id="forestAudio"
src="scott-buckley-moonlight(chosic.com).mp3"
loop>
</audio>

<audio
id="lofiAudio"
src="the_mountain-relax-508021.mp3"
loop>
</audio>

<script src="dashboard.js"></script>

</body>
</html>
