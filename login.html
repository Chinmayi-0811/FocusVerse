<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>FocusVerse Login</title>

<link rel="stylesheet"
href="auth.css">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<div class="background"></div>

<div class="auth-container">

<h1>
FocusVerse
</h1>

<p class="subtitle">
Welcome Back
</p>

<div class="auth-box">

<input
type="text"
id="username"
placeholder="Username">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="login()">
Login
</button>

<p id="message"></p>

<a href="register.html">
Create New Account
</a>

</div>

</div>

<script src="login.js"></script>

</body>
</html>
